[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podfetch"
version = "1.0.0"
description = "Config-driven podcast fetcher with Sonos-compatible playlists and apprise notifications"
requires-python = ">=3.10"
dependencies = [
  "apprise",
  "feedparser",
  "mutagen",
  "requests",
  "pyyaml",
  "pillow",
]

[project.scripts]
podfetch = "podfetch.cli:main"

[tool.setuptools]
packages = ["podfetch"]
