# podfetch configuration — live-usage proof, mirrors bin/alldownload.sh feeds.
# Copy to ~/.config/podfetch/config.yaml or pass with `podfetch fetch -c`.
output_dir: /media/silent/music/kinder/podcasts
state_dir: ~/.local/state/podfetch
user_agent: "podfetch/1.0 (+https://github.com/makefu/audio-scripts)"
timeout: 30
retries: 2

notify:
  enabled: true
  apprise_urls:
    # - tgram://<bot-token>/<chat-id>
    # - ntfy://my-topic
    # - json://127.0.0.1:8080/notify
    []
  new_episodes: true
  errors: true
  error_throttle_minutes: 60
  max_episode_messages: 5

# Offline ad removal (podfetch.ads). Measured on these feeds 2026-09-27:
# public-radio feeds are ad-free, megaphone (Was ist Was) bakes ads into the
# mp3 with no markers/silence/loudness signal — detection is conservative:
# silence clusters cut only with a loudness step, fingerprint-shared spans
# (>=10s between episodes) cut directly; ASR keywords need the
# podfetchWithWhisper package + ads.asr=true.
ads:
  enabled: true
  fingerprint: true
  asr: false
  # silence_db: -45          # dBFS below which a frame counts as silence
  # cluster_min_break_s: 20  # a silence cluster must span this long to cut
  # loudness_step_lu: 2      # required |Δ loudness| (LU) for silence cuts
  # fp_similarity: 0.7       # chromaprint word similarity for a window match
  # ffmpeg: /run/current-system/sw/bin/ffmpeg  # or leave on PATH

